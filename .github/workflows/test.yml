name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Ruff
        run: uv run --group dev ruff check

      - name: Sync env for pyright
        run: uv sync --all-extras

      - name: Pyright
        run: npx --yes pyright

      - name: Pytest (3.9 / 3.14)
        run: ./scripts/run-pytest.sh
