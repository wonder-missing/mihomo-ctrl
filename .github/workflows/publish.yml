name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv version --short)"
          if [ "$tag" != "$project" ]; then
            echo "Tag v${tag} does not match project version ${project}"
            exit 1
          fi

      - run: uv build --no-sources

      - name: Smoke test distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/*.whl dist/*.tar.gz)
          if [ "${#pkgs[@]}" -ne 2 ]; then
            echo "expected 1 wheel and 1 sdist, got: ${pkgs[*]:-<none>}"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            uv run --isolated --no-project --with "$pkg" -- mihomo-ctrl --version
            uv run --isolated --no-project --with "$pkg" -- mihomo-ctrl --help
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mihomo-ctrl
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - run: uv publish
