[project]
name = "mihomo-ctrl"
version = "0.1.0"
description = "Mihomo CLI 控制工具"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wonder", email = "wonderbeyond@gmail.com" },
]
keywords = ["mihomo", "clash", "proxy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/wonder-missing/mihomo-ctrl"
Repository = "https://github.com/wonder-missing/mihomo-ctrl"
Issues = "https://github.com/wonder-missing/mihomo-ctrl/issues"

[project.scripts]
mihomo-ctrl = "mihomo_ctrl.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mihomo_ctrl"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "textual>=8.2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "standard"
include = ["src"]
