[project]
name = "mihomo-ctrl"
version = "0.1.0"
description = "Mihomo CLI 控制工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/wonder-missing/mihomo-ctrl"
Repository = "https://github.com/wonder-missing/mihomo-ctrl"

[project.scripts]
mihomo-ctrl = "mihomo_ctrl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mihomo_ctrl"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.8.0",
    "textual>=8.2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "standard"
include = ["src"]
